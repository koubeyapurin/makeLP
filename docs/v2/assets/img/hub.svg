<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="t d" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Meiryo,sans-serif">
<title id="t">出会いの運営を中心にしたつながり</title>
<desc id="d">中心は出会いの運営(コミュニティ)。上にJTB(法人営業、現地のコミュニティマネージャー、イベント運営)、左に日本の観光・食・体験の事業者、右に現地の観光産業(ホテル・旅行手配会社・施設・提携店)、下に現地の若手・学生がつながる。</desc>
<rect width="1200" height="760" fill="#F4EFE6"/>
<circle cx="600" cy="400" r="300" fill="none" stroke="#C9C2B4" stroke-width="1" stroke-dasharray="2 6"/>
<circle cx="600" cy="400" r="220" fill="none" stroke="#C9C2B4" stroke-width="1" stroke-dasharray="2 6"/>
<path d="M600 170L600 272" stroke="#1E2A3A" stroke-width="1.5"/>
<path d="M340 400L472 400" stroke="#1E2A3A" stroke-width="1.5"/>
<path d="M860 400L728 400" stroke="#1E2A3A" stroke-width="1.5"/>
<path d="M600 624L600 528" stroke="#1E2A3A" stroke-width="1.5"/>
<text x="612" y="226" font-size="14" fill="#5B6472" text-anchor="start" font-weight="400">運営する</text>
<text x="402" y="384" font-size="14" fill="#5B6472" text-anchor="middle" font-weight="400">会員として</text>
<text x="402" y="424" font-size="14" fill="#5B6472" text-anchor="middle" font-weight="400">参加する</text>
<text x="800" y="384" font-size="14" fill="#5B6472" text-anchor="middle" font-weight="400">取引のある</text>
<text x="800" y="424" font-size="14" fill="#5B6472" text-anchor="middle" font-weight="400">相手が出る</text>
<text x="612" y="584" font-size="14" fill="#5B6472" text-anchor="start" font-weight="400">共同プロジェクト</text>
<circle cx="600" cy="400" r="128" fill="#1E2A3A"/><circle cx="600" cy="400" r="138" fill="none" stroke="#C8733A" stroke-width="1.5"/>
<text x="600" y="350" font-size="15" fill="#E9B48A" text-anchor="middle" font-weight="400" font-family="'Cormorant Garamond','Times New Roman',Georgia,serif" letter-spacing="2" font-style="italic">community</text>
<text x="600" y="404" font-size="30" fill="#FFFFFF" text-anchor="middle" font-weight="600" font-family="'Shippori Mincho','Noto Serif JP','Hiragino Mincho ProN','Yu Mincho',serif">出会いの運営</text>
<text x="600" y="440" font-size="17" fill="#E6E1D6" text-anchor="middle" font-weight="400">(コミュニティ)</text>
<rect x="250" y="40" width="700" height="130" fill="#FBF8F2" stroke="#1E2A3A" stroke-width="1.2"/>
<text x="600" y="70" font-size="14" fill="#A3521C" text-anchor="middle" font-weight="400" font-family="'Cormorant Garamond','Times New Roman',Georgia,serif" letter-spacing="2" font-style="italic">organizer</text>
<text x="600" y="100" font-size="22" fill="#1E2A3A" text-anchor="middle" font-weight="600" font-family="'Shippori Mincho','Noto Serif JP','Hiragino Mincho ProN','Yu Mincho',serif">JTB</text>
<rect x="284.0" y="116" width="150" height="36" rx="18" fill="none" stroke="#C9C2B4" stroke-width="1.2"/><text x="359.0" y="140" font-size="15" fill="#1E2A3A" text-anchor="middle" font-weight="400">法人営業</text>
<rect x="450.0" y="116" width="290" height="36" rx="18" fill="none" stroke="#C9C2B4" stroke-width="1.2"/><text x="595.0" y="140" font-size="15" fill="#1E2A3A" text-anchor="middle" font-weight="400">現地のコミュニティマネージャー</text>
<rect x="756.0" y="116" width="160" height="36" rx="18" fill="none" stroke="#C9C2B4" stroke-width="1.2"/><text x="836.0" y="140" font-size="15" fill="#1E2A3A" text-anchor="middle" font-weight="400">イベント運営</text>
<rect x="40" y="320" width="300" height="160" fill="#FBF8F2" stroke="#1E2A3A" stroke-width="1.2"/>
<text x="190" y="352" font-size="14" fill="#A3521C" text-anchor="middle" font-weight="400" font-family="'Cormorant Garamond','Times New Roman',Georgia,serif" letter-spacing="2" font-style="italic">members</text>
<text x="190" y="392" font-size="19" fill="#1E2A3A" text-anchor="middle" font-weight="600" font-family="'Shippori Mincho','Noto Serif JP','Hiragino Mincho ProN','Yu Mincho',serif">日本の観光・食・体験の</text>
<text x="190" y="422" font-size="19" fill="#1E2A3A" text-anchor="middle" font-weight="600" font-family="'Shippori Mincho','Noto Serif JP','Hiragino Mincho ProN','Yu Mincho',serif">事業者</text>
<text x="190" y="456" font-size="14" fill="#5B6472" text-anchor="middle" font-weight="400">経営者・駐在員</text>
<rect x="860" y="320" width="300" height="160" fill="#FBF8F2" stroke="#1E2A3A" stroke-width="1.2"/>
<text x="1010" y="352" font-size="14" fill="#A3521C" text-anchor="middle" font-weight="400" font-family="'Cormorant Garamond','Times New Roman',Georgia,serif" letter-spacing="2" font-style="italic">local partners</text>
<text x="1010" y="392" font-size="21" fill="#1E2A3A" text-anchor="middle" font-weight="600" font-family="'Shippori Mincho','Noto Serif JP','Hiragino Mincho ProN','Yu Mincho',serif">現地の観光産業</text>
<text x="1010" y="426" font-size="14" fill="#5B6472" text-anchor="middle" font-weight="400">ホテル・旅行手配会社・</text>
<text x="1010" y="450" font-size="14" fill="#5B6472" text-anchor="middle" font-weight="400">施設・提携店</text>
<rect x="450" y="624" width="300" height="104" fill="#FBF8F2" stroke="#1E2A3A" stroke-width="1.2"/>
<text x="600" y="656" font-size="14" fill="#A3521C" text-anchor="middle" font-weight="400" font-family="'Cormorant Garamond','Times New Roman',Georgia,serif" letter-spacing="2" font-style="italic">next generation</text>
<text x="600" y="696" font-size="21" fill="#1E2A3A" text-anchor="middle" font-weight="600" font-family="'Shippori Mincho','Noto Serif JP','Hiragino Mincho ProN','Yu Mincho',serif">現地の若手・学生</text>
</svg>
