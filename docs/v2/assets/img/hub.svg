<text x="800" y="384" font-size="14" fill="#6b6b6b" text-anchor="middle" font-weight="400">取引のある</text>
<text x="800" y="424" font-size="14" fill="#6b6b6b" text-anchor="middle" font-weight="400">相手が出る</text>
<text x="612" y="592" font-size="14" fill="#6b6b6b" text-anchor="start" font-weight="400">共同プロジェクト</text>
