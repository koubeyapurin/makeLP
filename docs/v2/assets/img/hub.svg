<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="t d" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Meiryo,sans-serif">
<title id="t">出会いの運営を中心にしたつながり</title>
<desc id="d">中心は出会いの運営(コミュニティ)。上にJTB(法人営業、現地のコミュニティマネージャー、イベント運営)、左に日本の観光・食・体験の事業者、右に現地の観光産業(ホテル・旅行手配会社・施設・提携店)、下に現地の若手・学生がつながる。</desc>
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#cd0401"/><stop offset=".5" stop-color="#de300b"/><stop offset="1" stop-color="#ea5213"/></linearGradient><filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#323232" flood-opacity=".12"/></filter></defs>
<rect width="1200" height="760" fill="#f6f6f6"/>
<circle cx="600" cy="400" r="290" fill="none" stroke="url(#g)" stroke-width="1" opacity=".45"/><circle cx="600" cy="400" r="215" fill="none" stroke="#d4d4d4" stroke-width="1" stroke-dasharray="2 6"/>
<path d="M600 170V258" stroke="#cc0000" stroke-width="1.5"/><path d="M340 400H458" stroke="#001c7b" stroke-width="1.5"/><path d="M860 400H742" stroke="#005064" stroke-width="1.5"/><path d="M600 624V542" stroke="#005064" stroke-width="1.5"/>
