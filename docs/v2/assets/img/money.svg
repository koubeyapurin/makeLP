<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="t d" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Meiryo,sans-serif">
<title id="t">お金の流れ</title>
<desc id="d">会員(日本の事業者)からJTBへ、プログラム参加費(主収益)と会費(相場並み)が流れる。紹介料・成功報酬は取らず、席料は受け取らない。</desc>
<rect width="1200" height="520" fill="#F4EFE6"/>
<rect x="40" y="60" width="300" height="250" fill="#FBF8F2" stroke="#1E2A3A" stroke-width="1.2"/>
<text x="190" y="100" font-size="14" fill="#A3521C" text-anchor="middle" font-weight="400" font-family="'Cormorant Garamond','Times New Roman',Georgia,serif" letter-spacing="2" font-style="italic">members</text>
<text x="190" y="170" font-size="34" fill="#1E2A3A" text-anchor="middle" font-weight="600" font-family="'Shippori Mincho','Noto Serif JP','Hiragino Mincho ProN','Yu Mincho',serif">会員</text>
<text x="190" y="210" font-size="15" fill="#5B6472" text-anchor="middle" font-weight="400">日本の観光・食・体験の</text>
<text x="190" y="234" font-size="15" fill="#5B6472" text-anchor="middle" font-weight="400">事業者</text>
<rect x="860" y="60" width="300" height="250" fill="#1E2A3A"/>
<text x="1010" y="100" font-size="14" fill="#E9B48A" text-anchor="middle" font-weight="400" font-family="'Cormorant Garamond','Times New Roman',Georgia,serif" letter-spacing="2" font-style="italic">organizer</text>
<text x="1010" y="170" font-size="34" fill="#FFFFFF" text-anchor="middle" font-weight="600" font-family="'Shippori Mincho','Noto Serif JP','Hiragino Mincho ProN','Yu Mincho',serif">JTB</text>
<text x="1010" y="210" font-size="15" fill="#E6E1D6" text-anchor="middle" font-weight="400">出会いの運営</text>
<path d="M350 130H840M824 120l16 10-16 10" fill="none" stroke="#C8733A" stroke-width="3"/>
<text x="600" y="108" font-size="24" fill="#1E2A3A" text-anchor="middle" font-weight="600" font-family="'Shippori Mincho','Noto Serif JP','Hiragino Mincho ProN','Yu Mincho',serif">プログラム参加費</text>
<rect x="525" y="140" width="150" height="30" rx="15" fill="#C8733A"/><text x="600" y="161" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="600">主収益</text>
<text x="600" y="194" font-size="15" fill="#5B6472" text-anchor="middle" font-weight="400">商談会・視察・テスト販売</text>
<path d="M350 250H840M824 242l16 8-16 8" fill="none" stroke="#1E2A3A" stroke-width="1.5"/>
<text x="600" y="236" font-size="20" fill="#1E2A3A" text-anchor="middle" font-weight="600" font-family="'Shippori Mincho','Noto Serif JP','Hiragino Mincho ProN','Yu Mincho',serif">会費(相場並み)</text>
<text x="600" y="280" font-size="15" fill="#5B6472" text-anchor="middle" font-weight="400">入会審査とセットで、参加者の質を守る</text>
<path d="M40 358H1160" stroke="#C9C2B4"/>
<text x="40" y="400" font-size="14" fill="#5B6472" text-anchor="start" font-weight="400" font-family="'Cormorant Garamond','Times New Roman',Georgia,serif" letter-spacing="2" font-style="italic">what we do not take</text>
<text x="40" y="436" font-size="22" fill="#1E2A3A" text-anchor="start" font-weight="600" font-family="'Shippori Mincho','Noto Serif JP','Hiragino Mincho ProN','Yu Mincho',serif">取らないもの</text>
<circle cx="342" cy="428" r="18" fill="none" stroke="#1E2A3A" stroke-width="1.5"/><path d="M330 416l24 24M354 416l-24 24" stroke="#1E2A3A" stroke-width="1.5"/>
<text x="374" y="424" font-size="20" fill="#1E2A3A" text-anchor="start" font-weight="600" font-family="'Shippori Mincho','Noto Serif JP','Hiragino Mincho ProN','Yu Mincho',serif">紹介料</text>
<text x="374" y="450" font-size="14" fill="#5B6472" text-anchor="start" font-weight="400">紹介でもうけない</text>
<circle cx="622" cy="428" r="18" fill="none" stroke="#1E2A3A" stroke-width="1.5"/><path d="M610 416l24 24M634 416l-24 24" stroke="#1E2A3A" stroke-width="1.5"/>
<text x="654" y="424" font-size="20" fill="#1E2A3A" text-anchor="start" font-weight="600" font-family="'Shippori Mincho','Noto Serif JP','Hiragino Mincho ProN','Yu Mincho',serif">成功報酬</text>
<text x="654" y="450" font-size="14" fill="#5B6472" text-anchor="start" font-weight="400">商談の結果で取らない</text>
<circle cx="902" cy="428" r="18" fill="none" stroke="#1E2A3A" stroke-width="1.5"/><path d="M890 416l24 24M914 416l-24 24" stroke="#1E2A3A" stroke-width="1.5"/>
<text x="934" y="424" font-size="20" fill="#1E2A3A" text-anchor="start" font-weight="600" font-family="'Shippori Mincho','Noto Serif JP','Hiragino Mincho ProN','Yu Mincho',serif">席料</text>
<text x="934" y="450" font-size="14" fill="#5B6472" text-anchor="start" font-weight="400">場所は主役にしない</text>
</svg>
