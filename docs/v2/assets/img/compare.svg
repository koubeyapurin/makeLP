<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" aria-labelledby="t d" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Meiryo,sans-serif">
<title id="t">繋ぐまでと繋いだ後の比較</title>
<desc id="d">既存の商工会議所・公的支援・社内の海外進出支援窓口は繋ぐまでを支える。本案は繋いだ後を運営する。</desc>
<rect width="1200" height="460" fill="#F4EFE6"/>
<rect x="40" y="40" width="540" height="380" fill="#FBF8F2" stroke="#C9C2B4" stroke-width="1.2"/>
<text x="70" y="82" font-size="14" fill="#5B6472" text-anchor="start" font-weight="400" font-family="'Cormorant Garamond','Times New Roman',Georgia,serif" letter-spacing="2" font-style="italic">until the introduction</text>
<text x="70" y="124" font-size="30" fill="#5B6472" text-anchor="start" font-weight="600" font-family="'Shippori Mincho','Noto Serif JP','Hiragino Mincho ProN','Yu Mincho',serif">繋ぐまで</text>
<text x="550" y="124" font-size="15" fill="#5B6472" text-anchor="end" font-weight="400">既存の支援</text>
<path d="M70 154h480" stroke="#C9C2B4"/><text x="70" y="184" font-size="19" fill="#1E2A3A" text-anchor="start" font-weight="600" font-family="'Shippori Mincho','Noto Serif JP','Hiragino Mincho ProN','Yu Mincho',serif">商工会議所</text>
<text x="70" y="212" font-size="15" fill="#5B6472" text-anchor="start" font-weight="400">日系企業どうしの情報交換・分科会</text>
<path d="M70 230h480" stroke="#C9C2B4"/><text x="70" y="260" font-size="19" fill="#1E2A3A" text-anchor="start" font-weight="600" font-family="'Shippori Mincho','Noto Serif JP','Hiragino Mincho ProN','Yu Mincho',serif">公的支援</text>
<text x="70" y="288" font-size="15" fill="#5B6472" text-anchor="start" font-weight="400">情報・イベント。特定企業の紹介はしない</text>
<path d="M70 306h480" stroke="#C9C2B4"/><text x="70" y="336" font-size="19" fill="#1E2A3A" text-anchor="start" font-weight="600" font-family="'Shippori Mincho','Noto Serif JP','Hiragino Mincho ProN','Yu Mincho',serif">社内の海外進出支援窓口</text>
<text x="70" y="364" font-size="15" fill="#5B6472" text-anchor="start" font-weight="400">市場調査・法人設立・視察</text>
<rect x="620" y="40" width="540" height="380" fill="#1E2A3A"/>
<text x="650" y="82" font-size="14" fill="#E9B48A" text-anchor="start" font-weight="400" font-family="'Cormorant Garamond','Times New Roman',Georgia,serif" letter-spacing="2" font-style="italic">after the introduction</text>
<text x="650" y="124" font-size="30" fill="#FFFFFF" text-anchor="start" font-weight="600" font-family="'Shippori Mincho','Noto Serif JP','Hiragino Mincho ProN','Yu Mincho',serif">繋いだ後</text>
<text x="1130" y="124" font-size="15" fill="#E9B48A" text-anchor="end" font-weight="600">本案</text>
<path d="M650 154h480" stroke="#3A4758"/><text x="650" y="184" font-size="19" fill="#FFFFFF" text-anchor="start" font-weight="600" font-family="'Shippori Mincho','Noto Serif JP','Hiragino Mincho ProN','Yu Mincho',serif">相手側が場にいる</text>
<text x="650" y="212" font-size="15" fill="#E6E1D6" text-anchor="start" font-weight="400">JTBが取引する現地の観光産業が集まりに出る</text>
<path d="M650 230h480" stroke="#3A4758"/><text x="650" y="260" font-size="19" fill="#FFFFFF" text-anchor="start" font-weight="600" font-family="'Shippori Mincho','Noto Serif JP','Hiragino Mincho ProN','Yu Mincho',serif">紹介の後を追う</text>
<text x="650" y="288" font-size="15" fill="#E6E1D6" text-anchor="start" font-weight="400">30日・90日のフォロー、先行会員の共有会</text>
<path d="M650 306h480" stroke="#3A4758"/><text x="650" y="336" font-size="19" fill="#FFFFFF" text-anchor="start" font-weight="600" font-family="'Shippori Mincho','Noto Serif JP','Hiragino Mincho ProN','Yu Mincho',serif">続いたかを数える</text>
<text x="650" y="364" font-size="15" fill="#E6E1D6" text-anchor="start" font-weight="400">協業が12か月後も続いているか</text>
<circle cx="600" cy="230" r="22" fill="#C8733A"/><path d="M590 230h18M602 222l8 8-8 8" fill="none" stroke="#FFFFFF" stroke-width="2"/>
</svg>
