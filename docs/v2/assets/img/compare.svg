<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" aria-labelledby="t d" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Meiryo,sans-serif">
<title id="t">繋ぐまでと繋いだ後の比較</title>
<desc id="d">既存の商工会議所・公的支援・社内の海外進出支援窓口は繋ぐまでを支える。本案は繋いだ後を運営する。</desc>
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#cd0401"/><stop offset=".5" stop-color="#de300b"/><stop offset="1" stop-color="#ea5213"/></linearGradient><filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#323232" flood-opacity=".12"/></filter></defs>
<rect width="1200" height="460" fill="#f6f6f6"/>
<rect x="40" y="40" width="540" height="380" rx="4" fill="#fff" filter="url(#sh)"/>
<rect x="40" y="40" width="540" height="3" fill="#d4d4d4"/>
<text x="70" y="82" font-size="13" fill="#6b6b6b" text-anchor="start" font-weight="400" font-family="'Open Sans','Helvetica Neue',Arial,sans-serif" letter-spacing="1.5">until the introduction</text>
<text x="70" y="124" font-size="30" fill="#6b6b6b" text-anchor="start" font-weight="700">繋ぐまで</text>
<text x="550" y="124" font-size="15" fill="#6b6b6b" text-anchor="end" font-weight="400">既存の支援</text>
<path d="M70 154h480" stroke="#d4d4d4"/><text x="70" y="184" font-size="19" fill="#323232" text-anchor="start" font-weight="700">商工会議所</text>
<text x="70" y="212" font-size="15" fill="#6b6b6b" text-anchor="start" font-weight="400">日系企業どうしの情報交換・分科会</text>
<path d="M70 230h480" stroke="#d4d4d4"/><text x="70" y="260" font-size="19" fill="#323232" text-anchor="start" font-weight="700">公的支援</text>
<text x="70" y="288" font-size="15" fill="#6b6b6b" text-anchor="start" font-weight="400">情報・イベント。特定企業の紹介はしない</text>
<path d="M70 306h480" stroke="#d4d4d4"/><text x="70" y="336" font-size="19" fill="#323232" text-anchor="start" font-weight="700">社内の海外進出支援窓口</text>
<text x="70" y="364" font-size="15" fill="#6b6b6b" text-anchor="start" font-weight="400">市場調査・法人設立・視察</text>
<rect x="620" y="40" width="540" height="380" rx="4" fill="#fff" filter="url(#sh)"/>
<rect x="620.75" y="40.75" width="538.5" height="378.5" rx="4" fill="none" stroke="url(#g)" stroke-width="1.5"/>
<rect x="620" y="40" width="540" height="3" fill="url(#g)"/>
<text x="650" y="82" font-size="13" fill="#cc0000" text-anchor="start" font-weight="500" font-family="'Open Sans','Helvetica Neue',Arial,sans-serif" letter-spacing="1.5">after the introduction</text>
<text x="650" y="124" font-size="30" fill="#323232" text-anchor="start" font-weight="700">繋いだ後</text>
<text x="1130" y="124" font-size="15" fill="#cc0000" text-anchor="end" font-weight="700">本案</text>
<path d="M650 154h480" stroke="#d4d4d4"/><circle cx="656" cy="178" r="4" fill="#005064"/><text x="670" y="184" font-size="19" fill="#323232" text-anchor="start" font-weight="700">相手側が場にいる</text>
<text x="670" y="212" font-size="15" fill="#6b6b6b" text-anchor="start" font-weight="400">JTBが取引する現地の観光産業が集まりに出る</text>
<path d="M650 230h480" stroke="#d4d4d4"/><circle cx="656" cy="254" r="4" fill="#ea5213"/><text x="670" y="260" font-size="19" fill="#323232" text-anchor="start" font-weight="700">紹介の後を追う</text>
<text x="670" y="288" font-size="15" fill="#6b6b6b" text-anchor="start" font-weight="400">30日・90日のフォロー、先行会員の共有会</text>
<path d="M650 306h480" stroke="#d4d4d4"/><circle cx="656" cy="330" r="4" fill="#ea5213"/><text x="670" y="336" font-size="19" fill="#323232" text-anchor="start" font-weight="700">続いたかを数える</text>
<text x="670" y="364" font-size="15" fill="#6b6b6b" text-anchor="start" font-weight="400">協業が12か月後も続いているか</text>
<circle cx="600" cy="230" r="22" fill="#fff" stroke="url(#g)" stroke-width="1.5" filter="url(#sh)"/><path d="M590 230h18M602 222l8 8-8 8" fill="none" stroke="#ea5213" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
