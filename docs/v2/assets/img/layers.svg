<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="t d" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Meiryo,sans-serif">
<title id="t">豊かさの3層</title>
<desc id="d">人、会社、現地の3層で豊かさを測る。人は現地で相談できる相手が3人以上いる会員の割合(目標70%、仮定)と海外で仕事ができる自信。会社は紹介経由の商談と協業の開始・継続。現地は現地事業者の日本企業との新規取引と若手・学生との共同プロジェクト。</desc>
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#cd0401"/><stop offset=".5" stop-color="#de300b"/><stop offset="1" stop-color="#ea5213"/></linearGradient><filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#323232" flood-opacity=".12"/></filter></defs>
<rect width="1200" height="520" fill="#f6f6f6"/>
<rect x="40" y="40" width="340" height="370" rx="4" fill="#fff" filter="url(#sh)"/>
<rect x="40" y="40" width="340" height="3" fill="#001c7b"/>
<text x="70" y="104" font-size="42" fill="#cc0000" text-anchor="start" font-weight="400" font-family="Georgia,'Times New Roman',serif">I</text>
<text x="350" y="96" font-size="13" fill="#6b6b6b" text-anchor="end" font-weight="400" font-family="'Open Sans','Helvetica Neue',Arial,sans-serif" letter-spacing="1.5">person</text>
<text x="70" y="160" font-size="34" fill="#323232" text-anchor="start" font-weight="700">人</text>
<path d="M70 184h280" stroke="#d4d4d4"/>
<text x="70" y="226" font-size="17" fill="#323232" text-anchor="start" font-weight="500">現地で相談できる相手が</text>
<text x="70" y="256" font-size="17" fill="#323232" text-anchor="start" font-weight="500">3人以上いる会員の割合</text>
<text x="70" y="286" font-size="14" fill="#6b6b6b" text-anchor="start" font-weight="400">目標 70%(仮定)</text>
<text x="70" y="326" font-size="17" fill="#323232" text-anchor="start" font-weight="500">海外で仕事ができる自信</text>
<text x="70" y="356" font-size="14" fill="#6b6b6b" text-anchor="start" font-weight="400">入会時→6か月後</text>
<path d="M392 225h26M410 217l8 8-8 8" fill="none" stroke="#ea5213" stroke-width="1.5"/>
<rect x="430" y="40" width="340" height="370" rx="4" fill="#fff" filter="url(#sh)"/>
<rect x="430" y="40" width="340" height="3" fill="url(#g)"/>
<text x="460" y="104" font-size="42" fill="#cc0000" text-anchor="start" font-weight="400" font-family="Georgia,'Times New Roman',serif">II</text>
<text x="740" y="96" font-size="13" fill="#6b6b6b" text-anchor="end" font-weight="400" font-family="'Open Sans','Helvetica Neue',Arial,sans-serif" letter-spacing="1.5">company</text>
<text x="460" y="160" font-size="34" fill="#323232" text-anchor="start" font-weight="700">会社</text>
<path d="M460 184h280" stroke="#d4d4d4"/>
<text x="460" y="226" font-size="17" fill="#323232" text-anchor="start" font-weight="500">紹介経由の商談数</text>
<text x="460" y="256" font-size="14" fill="#6b6b6b" text-anchor="start" font-weight="400">会員1社あたり・6か月</text>
<text x="460" y="296" font-size="17" fill="#323232" text-anchor="start" font-weight="500">協業の開始と継続</text>
<text x="460" y="326" font-size="14" fill="#6b6b6b" text-anchor="start" font-weight="400">12か月後も続く割合</text>
<path d="M782 225h26M800 217l8 8-8 8" fill="none" stroke="#ea5213" stroke-width="1.5"/>
<rect x="820" y="40" width="340" height="370" rx="4" fill="#fff" filter="url(#sh)"/>
<rect x="820" y="40" width="340" height="3" fill="#005064"/>
<text x="850" y="104" font-size="42" fill="#cc0000" text-anchor="start" font-weight="400" font-family="Georgia,'Times New Roman',serif">III</text>
<text x="1130" y="96" font-size="13" fill="#6b6b6b" text-anchor="end" font-weight="400" font-family="'Open Sans','Helvetica Neue',Arial,sans-serif" letter-spacing="1.5">local</text>
<text x="850" y="160" font-size="34" fill="#323232" text-anchor="start" font-weight="700">現地</text>
<path d="M850 184h280" stroke="#d4d4d4"/>
<text x="850" y="226" font-size="17" fill="#323232" text-anchor="start" font-weight="500">現地事業者の</text>
<text x="850" y="256" font-size="17" fill="#323232" text-anchor="start" font-weight="500">日本企業との新規取引</text>
<text x="850" y="300" font-size="17" fill="#323232" text-anchor="start" font-weight="500">若手・学生との</text>
<text x="850" y="330" font-size="17" fill="#323232" text-anchor="start" font-weight="500">共同プロジェクト</text>
<path d="M1010 420v40H210v-40M202 430l8-10 8 10" fill="none" stroke="url(#g)" stroke-width="1.5"/>
<text x="600" y="494" font-size="16" fill="#323232" text-anchor="middle" font-weight="500">現地にも仕事が返り、関係が続くほど、次の出会いが生まれる</text>
</svg>
