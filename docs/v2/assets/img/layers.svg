<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="t d" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Meiryo,sans-serif">
<title id="t">豊かさの3層</title>
<desc id="d">人、会社、現地の3層で豊かさを測る。人は現地で相談できる相手が3人以上いる会員の割合(目標70%、仮定)と海外で仕事ができる自信。会社は紹介経由の商談と協業の開始・継続。現地は現地事業者の日本企業との新規取引と若手・学生との共同プロジェクト。</desc>
<rect width="1200" height="520" fill="#F4EFE6"/>
<rect x="40" y="40" width="340" height="380" fill="#FBF8F2" stroke="#1E2A3A" stroke-width="1.2"/>
<text x="70" y="104" font-size="44" fill="#C8733A" text-anchor="start" font-weight="400" font-family="'Cormorant Garamond','Times New Roman',Georgia,serif">I</text>
<text x="350" y="96" font-size="14" fill="#5B6472" text-anchor="end" font-weight="400" font-family="'Cormorant Garamond','Times New Roman',Georgia,serif" letter-spacing="2" font-style="italic">person</text>
<text x="70" y="160" font-size="34" fill="#1E2A3A" text-anchor="start" font-weight="600" font-family="'Shippori Mincho','Noto Serif JP','Hiragino Mincho ProN','Yu Mincho',serif">人</text>
<path d="M70 184h280" stroke="#C9C2B4"/>
<text x="70" y="226" font-size="17" fill="#1E2A3A" text-anchor="start" font-weight="500">現地で相談できる相手が</text>
<text x="70" y="256" font-size="17" fill="#1E2A3A" text-anchor="start" font-weight="500">3人以上いる会員の割合</text>
<text x="70" y="286" font-size="14" fill="#5B6472" text-anchor="start" font-weight="400">目標 70%(仮定)</text>
<text x="70" y="322" font-size="17" fill="#1E2A3A" text-anchor="start" font-weight="500">海外で仕事ができる自信</text>
<text x="70" y="352" font-size="14" fill="#5B6472" text-anchor="start" font-weight="400">入会時→6か月後</text>
<path d="M392 230h26M410 222l8 8-8 8" fill="none" stroke="#1E2A3A" stroke-width="1.5"/>
<rect x="430" y="40" width="340" height="380" fill="#FBF8F2" stroke="#1E2A3A" stroke-width="1.2"/>
<text x="460" y="104" font-size="44" fill="#C8733A" text-anchor="start" font-weight="400" font-family="'Cormorant Garamond','Times New Roman',Georgia,serif">II</text>
<text x="740" y="96" font-size="14" fill="#5B6472" text-anchor="end" font-weight="400" font-family="'Cormorant Garamond','Times New Roman',Georgia,serif" letter-spacing="2" font-style="italic">company</text>
<text x="460" y="160" font-size="34" fill="#1E2A3A" text-anchor="start" font-weight="600" font-family="'Shippori Mincho','Noto Serif JP','Hiragino Mincho ProN','Yu Mincho',serif">会社</text>
<path d="M460 184h280" stroke="#C9C2B4"/>
<text x="460" y="226" font-size="17" fill="#1E2A3A" text-anchor="start" font-weight="500">紹介経由の商談数</text>
<text x="460" y="256" font-size="14" fill="#5B6472" text-anchor="start" font-weight="400">会員1社あたり・6か月</text>
<text x="460" y="292" font-size="17" fill="#1E2A3A" text-anchor="start" font-weight="500">協業の開始と継続</text>
<text x="460" y="322" font-size="14" fill="#5B6472" text-anchor="start" font-weight="400">12か月後も続く割合</text>
<path d="M782 230h26M800 222l8 8-8 8" fill="none" stroke="#1E2A3A" stroke-width="1.5"/>
<rect x="820" y="40" width="340" height="380" fill="#FBF8F2" stroke="#1E2A3A" stroke-width="1.2"/>
<text x="850" y="104" font-size="44" fill="#C8733A" text-anchor="start" font-weight="400" font-family="'Cormorant Garamond','Times New Roman',Georgia,serif">III</text>
<text x="1130" y="96" font-size="14" fill="#5B6472" text-anchor="end" font-weight="400" font-family="'Cormorant Garamond','Times New Roman',Georgia,serif" letter-spacing="2" font-style="italic">local</text>
<text x="850" y="160" font-size="34" fill="#1E2A3A" text-anchor="start" font-weight="600" font-family="'Shippori Mincho','Noto Serif JP','Hiragino Mincho ProN','Yu Mincho',serif">現地</text>
<path d="M850 184h280" stroke="#C9C2B4"/>
<text x="850" y="226" font-size="17" fill="#1E2A3A" text-anchor="start" font-weight="500">現地事業者の</text>
<text x="850" y="256" font-size="17" fill="#1E2A3A" text-anchor="start" font-weight="500">日本企業との新規取引</text>
<text x="850" y="296" font-size="17" fill="#1E2A3A" text-anchor="start" font-weight="500">若手・学生との</text>
<text x="850" y="326" font-size="17" fill="#1E2A3A" text-anchor="start" font-weight="500">共同プロジェクト</text>
<path d="M1010 430v36H210v-36M202 440l8-10 8 10" fill="none" stroke="#C8733A" stroke-width="1.5"/>
<text x="600" y="494" font-size="16" fill="#1E2A3A" text-anchor="middle" font-weight="500" font-family="'Shippori Mincho','Noto Serif JP','Hiragino Mincho ProN','Yu Mincho',serif">現地にも仕事が返り、関係が続くほど、次の出会いが生まれる</text>
</svg>
