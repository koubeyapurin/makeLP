<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="t d" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Meiryo,sans-serif">
<title id="t">課題から解決への図</title>
<desc id="d">現地に知り合いがいない、情報が不足している、拠点を借りても出会えない、という3つの課題に対し、常設の出会いの運営で応える。</desc>
<rect width="1200" height="520" fill="#F7F8FA"/>
<text x="40" y="62" font-size="15" letter-spacing="3" fill="#B08D3E" font-weight="700">PROBLEM</text>
<text x="40" y="92" font-size="22" fill="#0B1530" font-weight="700">海外進出でよくある不安</text>
<g>
<rect x="40" y="116" width="460" height="104" rx="8" fill="#fff" stroke="#DDE1E8"/>
<circle cx="88" cy="168" r="24" fill="none" stroke="#B08D3E" stroke-width="2"/><text x="88" y="176" font-size="22" text-anchor="middle" fill="#B08D3E" font-weight="700">1</text>
<text x="136" y="162" font-size="24" fill="#0B1530" font-weight="700">現地に知り合いがいない</text>
<text x="136" y="194" font-size="16" fill="#5A6478">相談できる相手も、出会う糸口もない</text>
<rect x="40" y="238" width="460" height="104" rx="8" fill="#fff" stroke="#DDE1E8"/>
<circle cx="88" cy="290" r="24" fill="none" stroke="#B08D3E" stroke-width="2"/><text x="88" y="298" font-size="22" text-anchor="middle" fill="#B08D3E" font-weight="700">2</text>
<text x="136" y="284" font-size="24" fill="#0B1530" font-weight="700">情報が不足している</text>
<text x="136" y="316" font-size="16" fill="#5A6478">一歩目を踏み出しにくい</text>
<rect x="40" y="360" width="460" height="104" rx="8" fill="#fff" stroke="#DDE1E8"/>
<circle cx="88" cy="412" r="24" fill="none" stroke="#B08D3E" stroke-width="2"/><text x="88" y="420" font-size="22" text-anchor="middle" fill="#B08D3E" font-weight="700">3</text>
<text x="136" y="406" font-size="24" fill="#0B1530" font-weight="700">拠点を借りても出会えない</text>
<text x="136" y="438" font-size="16" fill="#5A6478">場所があるだけでは、交流は生まれない</text>
</g>
<g fill="none" stroke="#B08D3E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
<path d="M530 290h130"/><path d="M644 272l18 18-18 18"/></g>
<text x="596" y="270" font-size="15" text-anchor="middle" fill="#B08D3E" font-weight="700" letter-spacing="2">解決</text>
<rect x="690" y="116" width="470" height="348" rx="8" fill="#0B1530"/>
<rect x="690" y="116" width="470" height="6" rx="3" fill="#B08D3E"/>
<text x="730" y="172" font-size="15" letter-spacing="3" fill="#EFD98A" font-weight="700">SOLUTION</text>
<text x="730" y="236" font-size="40" fill="#fff" font-weight="700">常設の出会いの運営</text>
<path d="M730 262h60" stroke="#B08D3E" stroke-width="2"/>
<text x="730" y="300" font-size="18" fill="#E6E9F0">場所を貸すのではなく、</text>
<text x="730" y="328" font-size="18" fill="#E6E9F0">出会いの運営を届ける。</text>
<g font-size="18" font-weight="700" text-anchor="middle">
<rect x="730" y="372" width="110" height="44" rx="22" fill="none" stroke="#EFD98A"/><text x="785" y="401" fill="#EFD98A">拠点</text>
<text x="862" y="402" font-size="20" fill="#B08D3E">×</text>
<rect x="884" y="372" width="110" height="44" rx="22" fill="none" stroke="#EFD98A"/><text x="939" y="401" fill="#EFD98A">運営</text>
<text x="1016" y="402" font-size="20" fill="#B08D3E">×</text>
<rect x="1038" y="372" width="86" height="44" rx="22" fill="none" stroke="#EFD98A"/><text x="1081" y="401" fill="#EFD98A">交流</text>
</g>
</svg>
